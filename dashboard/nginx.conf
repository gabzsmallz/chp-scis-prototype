server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      # API proxy to FHIR mediator
      location /reports/ {
            proxy_pass http://fhir-mediator:3000/reports/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
  }

      # React app — client-side routing support
      location / {
            try_files $uri $uri/ /index.html;
  }
}
