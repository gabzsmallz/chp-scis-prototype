version: "3.8"

# CHP-SCIS Prototype - Full Stack
# University of Nairobi DSR Dissertation
# Run: docker compose up -d
# Access:
#   CHT webapp:       http://localhost:5988  (admin / medic)
#   OpenHIM console:  http://localhost:9000   (root@openhim.org / openhim1)
#   FHIR Mediator:    http://localhost:3000
#   Dashboard (React):http://localhost:4000
#   PostgreSQL:       localhost:5432 (cht / cht)

services:

  # ─── CHT Form Seeder ─────────────────────────────────────────────────────────
  # Uploads the stock_report form to CouchDB on every stack start.
  # Exits after seeding — restartPolicy: on-failure ensures it only retries on error.
  cht-seeder:
    image: curlimages/curl:latest
    container_name: cht-seeder
    restart: "no"
    depends_on:
      couchdb:
        condition: service_healthy
      cht-api:
        condition: service_started
    volumes:
      - ./scripts/seed-cht-forms.sh:/seed/seed.sh:ro
      - ./cht-app/forms/app/stock_report.json:/seed/stock_report.json:ro
      - ./cht-app/forms/app/stock_report.xml:/seed/stock_report.xml:ro
      - ./cht-app/translations/translations-en.json:/seed/translations-en.json:ro
    entrypoint: ["sh", "/seed/seed.sh"]
    networks:
      - chp-scis-net

  # ─── CHT Core ────────────────────────────────────────────────────────────────
  cht-api:
    image: public.ecr.aws/medic/cht-api:4.7.0
    container_name: cht-api
    restart: unless-stopped
    ports:
      - "5988:5988"
    environment:
      - COUCH_URL=http://admin:medic@couchdb:5984/medic
      - BUILDS_SERVER=https://staging.dev.medicmobile.org/_couch/builds_4
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - chp-scis-net
    volumes:
      - ./cht-app/:/srv/storage/medic-api/upgrade/

  cht-sentinel:
    image: public.ecr.aws/medic/cht-sentinel:4.7.0
    container_name: cht-sentinel
    restart: unless-stopped
    environment:
      - COUCH_URL=http://admin:medic@couchdb:5984/medic
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - chp-scis-net

  cht-haproxy:
    image: public.ecr.aws/medic/cht-haproxy:4.7.0
    container_name: cht-haproxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      - CHT_API=cht-api:5988
    depends_on:
      - cht-api
    networks:
      - chp-scis-net

  # ─── CouchDB ─────────────────────────────────────────────────────────────────
  couchdb:
    image: public.ecr.aws/medic/cht-couchdb:4.7.0
    container_name: couchdb
    restart: unless-stopped
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=medic
      - COUCHDB_SECRET=mysecret
      - SVC_NAME=couchdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:medic@localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - couchdb-data:/opt/couchdb/data
    networks:
      - chp-scis-net

  # ─── CHT-Sync (CouchDB → PostgreSQL) ─────────────────────────────────────────
  # cht-sync is disabled: no pre-built image exists; build from source via
  # https://github.com/medic/cht-sync when PostgreSQL analytics are needed.
  # cht-sync:
  #   build:
  #     context: ./cht-sync/couch2pg
  #     dockerfile: Dockerfile
  #   container_name: cht-sync
  #   restart: unless-stopped
  #   environment:
  #     - COUCHDB_URL=http://admin:medic@couchdb:5984
  #     - POSTGRES_URL=postgresql://cht:cht@postgres:5432/cht
  #     - COUCHDB_DBS=medic
  #   depends_on:
  #     couchdb:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - chp-scis-net

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cht
      - POSTGRES_PASSWORD=cht
      - POSTGRES_DB=cht
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cht"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - chp-scis-net

  # ─── OpenHIM Core (Interoperability Layer) ────────────────────────────────────
  openhim-core:
    image: jembi/openhim-core:v8.5.1
    container_name: openhim-core
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "5000:5000"   # HTTPS
      - "5001:5001"   # API
    environment:
      - mongo_url=mongodb://mongodb:27017/openhim-development
      - mongo_atnaUrl=mongodb://mongodb:27017/openhim-development
      - authentication_enableMutualTLSClientAuthentication=false
      - authentication_enableJWTAuthentication=false
      - general_loginSecurity_loginWindowMinutes=10
      - general_loginSecurity_maxLoginAttempts=5
    depends_on:
      - mongodb
    networks:
      - chp-scis-net

  openhim-console:
    image: jembi/openhim-console:latest
    container_name: openhim-console
    restart: unless-stopped
    ports:
      - "9000:80"
    environment:
      - OPENHIM_CORE_MEDIATOR_API_URL=https://openhim-core:8080
    networks:
      - chp-scis-net

  # ─── MongoDB (for OpenHIM) ────────────────────────────────────────────────────
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - chp-scis-net

  # ─── FHIR R5 Mediator (Node.js) ──────────────────────────────────────────────
  fhir-mediator:
    build:
      context: ./fhir-mediator
      dockerfile: Dockerfile
    container_name: fhir-mediator
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OPENHIM_URL=https://openhim-core:8080
      - OPENHIM_USER=root@openhim.org
      - OPENHIM_PASSWORD=openhim1
      - ILMIS_FHIR_ENDPOINT=http://ilmis-stub:4500/fhir
      - ILMIS_URL=http://ilmis-stub:4500
      - DHIS2_URL=http://dhis2-stub:4501
      - DHIS2_API_URL=http://dhis2-stub:4501/api
      - AFYAKE_URL=http://afyake-stub:4502
      - POSTGRES_URL=postgresql://cht:cht@postgres:5432/cht
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=cht
      - PG_USER=cht
      - PG_PASSWORD=cht
      - COUCHDB_URL=http://admin:medic@couchdb:5984
      - NODE_ENV=development
    depends_on:
      - openhim-core
      - postgres
      - afyake-stub
    networks:
      - chp-scis-net

  # ─── iLMIS Stub (mock KEMSA endpoint) ────────────────────────────────────────
  ilmis-stub:
    build:
      context: ./stubs/ilmis
      dockerfile: Dockerfile
    container_name: ilmis-stub
    restart: unless-stopped
    ports:
      - "4500:4500"
    networks:
      - chp-scis-net

  # ─── DHIS2 Stub (mock DHIS2 Tracker endpoint) ────────────────────────────────
  dhis2-stub:
    build:
      context: ./stubs/dhis2
      dockerfile: Dockerfile
    container_name: dhis2-stub
    restart: unless-stopped
    ports:
      - "4501:4501"
    networks:
      - chp-scis-net

  # ─── AfyaKE Stub (mock facility EMR/LMIS — receives formal SupplyRequests) ───
  afyake-stub:
    build:
      context: ./stubs/afyake
      dockerfile: Dockerfile
    container_name: afyake-stub
    restart: unless-stopped
    ports:
      - "4502:4502"
    networks:
      - chp-scis-net

  # ─── Decision Dashboard (React) ──────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "4000:80"
    environment:
      - REACT_APP_FHIR_MEDIATOR_URL=http://localhost:3000
      - REACT_APP_POSTGRES_PROXY_URL=http://localhost:3000/reports
    depends_on:
      - fhir-mediator
    networks:
      - chp-scis-net

volumes:
  couchdb-data:
  postgres-data:
  mongodb-data:

networks:
  chp-scis-net:
    driver: bridge
